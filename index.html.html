<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TikTok LIVE Gaming Overlay</title>
  <style>
    :root {
      --tt-cyan: #00f2fe;
      --tt-pink: #fe2c55;
      --panel-bg: rgba(18, 18, 24, 0.88);
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      position: relative;
    }

    /* --- TOP HEADER / SOCIALS --- */
    .header-bar {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: var(--panel-bg);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(254, 44, 85, 0.2);
      border: 1px solid var(--tt-pink);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--tt-pink);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--tt-pink);
      animation: pulse 1.4s infinite;
    }

    .channel-handle {
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .channel-handle span {
      color: var(--tt-cyan);
    }

    /* --- WEBCAM FRAME (TOP SLOT: 16:9 CAM) --- */
    .cam-frame {
      position: absolute;
      top: 140px;
      left: 60px;
      width: 960px;
      height: 540px;
      border-radius: var(--border-radius);
      padding: 3px;
      background: linear-gradient(120deg, var(--tt-cyan), var(--tt-pink), var(--tt-cyan));
      background-size: 250% 250%;
      animation: neonShift 5s ease infinite;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
    }

    .cam-inner {
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: calc(var(--border-radius) - 3px);
    }

    /* --- GAME FEED BORDER (CENTER/LOWER) --- */
    .game-frame {
      position: absolute;
      top: 720px;
      left: 60px;
      width: 960px;
      height: 540px;
      border-radius: var(--border-radius);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
    }

    /* --- TIKTOK GOAL / EVENT CARD --- */
    .event-card {
      position: absolute;
      top: 1300px;
      left: 60px;
      width: 960px;
      background: var(--panel-bg);
      border-radius: var(--border-radius);
      padding: 24px 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .event-header span {
      color: var(--tt-cyan);
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, var(--tt-cyan), var(--tt-pink));
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(254, 44, 85, 0.6);
      animation: barPulse 2.5s ease-in-out infinite alternate;
    }

    /* --- ANIMATIONS --- */
    @keyframes neonShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    @keyframes barPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.25); }
    }
  </style>
</head>
<body>

  <!-- Top Info Bar -->
  <div class="header-bar">
    <div class="badge"><span class="dot"></span> Live</div>
    <div class="channel-handle">Drop a <span>Follow</span> & <span>Like</span></div>
  </div>

  <!-- Webcam Frame (Align Camera feed here) -->
  <div class="cam-frame">
    <div class="cam-inner"></div>
  </div>

  <!-- Gameplay Border Guide -->
  <div class="game-frame"></div>

  <!-- Like / Follower Goal Box -->
  <div class="event-card">
    <div class="event-header">
      <div>Goal: Like Target</div>
      <span>6,500 / 10,000</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

</body>
</html>
